name: CCNA Study Path
on:
  pull_request:
    paths: ['src/components/quiz/CcnaStudyPath.tsx', 'src/lib/ccna-study-path.ts', 'src/app/**/study-path/**', 'tests/ccna-study-path.browser.cjs', 'tests/ccna-study-path.mobile.browser.cjs', '.github/workflows/ccna-study-path.yml']
jobs:
  diagnostic-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/ccna-study-path.browser.cjs tests/ccna-study-path.mobile.browser.cjs
