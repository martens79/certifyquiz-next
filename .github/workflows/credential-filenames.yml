name: Credential note filenames
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  filenames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/credential-filenames.test.mjs
      - run: node scripts/check-credential-filenames.mjs
