name: Admin question preview
on:
  pull_request:
    paths:
      - 'src/app/admin/question-preview/**'
      - 'src/components/quiz/QuizEngine.tsx'
      - 'tests/admin-question-preview.test.tsx'
      - '.github/workflows/admin-question-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-question-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsx --tsconfig tsconfig.test.json --test tests/admin-question-preview.test.tsx
