name: Admin Funnel Events
on:
  pull_request:
    paths:
      - 'src/app/admin/**'
      - 'src/lib/funnel-export.ts'
      - 'tests/admin-funnel-events.*'
      - '.github/workflows/admin-funnel-events.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-events:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npx --no-install eslint src/app/admin/AdminClient.tsx src/app/admin/FunnelEventsClient.tsx src/app/admin/AdminOverviewClient.tsx tests/admin-funnel-events.test.tsx tests/admin-funnel-events.spec.ts
      - run: node --import tsx --test tests/admin-funnel-events.test.tsx tests/funnel-export.test.ts tests/admin-analytics.test.ts
        env:
          TSX_TSCONFIG_PATH: tsconfig.test.json
